/* Single dark look, like the portfolio: #212121 page, #171717 bars,
   white at a few opacities, one red accent that only marks a starred take. */
:root{
  --bg:#212121;
  --bar:#171717;
  --box:#2a2a2a;
  --ctl:#363636;
  --ctl-2:#424242;
  --signed:#a3a3a3;   /* signed R/K/Z: grey, so the white note bar still shows */
  --ink:#ffffff;
  --ink-90:rgba(255,255,255,.9);
  --ink-68:rgba(255,255,255,.68);
  --ink-50:rgba(255,255,255,.5);
  --ink-30:rgba(255,255,255,.3);
  --accent:#F92E1E;
  --mono:'Roboto Mono',ui-monospace,Menlo,monospace;
  --display:'Stack Sans Headline','Arial Narrow',Helvetica,sans-serif;
  --fs-micro:12px;
  --fs-label:13.5px;
  --fs-body:16px;
  --fs-display:25px;
  --track:.14em;
  --gutter:20px;
  --ease:cubic-bezier(.2,.85,.2,1);
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;touch-action:manipulation;background:var(--bar)}
html,body{height:100%;max-width:100%;overflow:hidden;overscroll-behavior:none}
body{
  font-family:var(--mono);font-size:var(--fs-body);line-height:1.5;
  color:var(--ink);
  background:var(--bg);
  -webkit-font-smoothing:antialiased;
}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:1px solid var(--ink);outline-offset:2px}
.tnum{font-variant-numeric:tabular-nums}
.display{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:-.005em}
.label{font-size:var(--fs-micro);letter-spacing:var(--track);text-transform:uppercase;color:var(--ink-50)}
.ico{display:inline-flex;width:20px;height:20px;flex-shrink:0}
.ico svg{width:100%;height:100%}

#app{height:100%;display:flex;flex-direction:column;overflow:hidden}

/* ===== No borders anywhere: every box is a solid fill, stepped by lightness =====
   --bar #171717 (bars)  <  --bg #212121 (page)  <  --box #2a2a2a (cards)
   <  --ctl #363636 (controls on a card)  <  --ctl-2 #424242 (pressed / open)          */

/* ===== Header bar (44px; the viewer / :root already pad the top safe area) ===== */
.bar{background:var(--bar);flex-shrink:0;position:relative;z-index:20}
.bar-row{display:flex;align-items:center;height:44px;padding:0 4px;gap:0}
.bar-row.no-back{padding-left:var(--gutter)}
.bar-title{
  font-size:20px;line-height:1;flex:0 1 auto;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-top:2px;
}
.bar-count{font-size:var(--fs-micro);color:var(--ink-50);letter-spacing:.06em;margin-left:10px;flex-shrink:0}
.bar-spacer{flex:1}
.icon-btn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--ink);flex-shrink:0}
.icon-btn:active{color:var(--ink-50)}

/* ===== Shooting day: the map is the top of the list, so it is only there when you are at the top ===== */
#list{--gutter:14px}
.map{margin:0 calc(-1 * var(--gutter));background:var(--bar);padding:12px var(--gutter) 16px}
.map-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.track{flex:1;height:2px;background:var(--ctl)}
.track-fill{height:100%;background:var(--ink);transition:width .3s var(--ease)}
.map-rows{display:flex;flex-direction:column;gap:10px}
.map-row{display:grid;grid-template-columns:30px 1fr;align-items:start;gap:6px}
.map-ob{font-size:var(--fs-label);font-weight:700;color:var(--ink-50);line-height:28px}
.map-cells{display:flex;flex-wrap:wrap;gap:6px 6px}
.cell{
  position:relative;min-width:28px;height:28px;padding:0 5px;
  background:var(--ctl);color:var(--ink-68);
  font-size:11px;line-height:28px;text-align:center;
}
.cell:active{background:var(--ctl-2)}
.cell.done{background:var(--ink);color:var(--bar);font-weight:700}
.cell.cancel{
  background:var(--box);color:var(--ink-30);
  text-decoration:line-through;
}
.cell.has-star::after{content:'';position:absolute;top:0;right:0;width:7px;height:7px;background:var(--accent)}

/* ===== Scrolling list ===== */
.scroll{
  position:relative;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:0 var(--gutter) 24px;
}
/* on the shooting day, leave room so the last záběr can scroll up to the top */
#list{padding-bottom:55vh}
.section-label{padding:22px 0 10px}
/* the diagonal grain only shows on an empty screen */
.scroll.grain{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0 2px,transparent 2px 26px)}

/* záběr box */
.zblock{background:var(--box);margin-top:12px;padding:0 12px 6px}
.zblock:first-of-type{margin-top:14px}
.z-head{display:flex;align-items:center;gap:12px;padding:8px 0 4px}
.z-num{font-size:24px;line-height:1;transition:color .5s var(--ease);padding:8px 0;display:inline-flex;align-items:baseline;gap:.35em;white-space:nowrap}
.z-sep{color:var(--ink-30);font-weight:400;transform:translateY(-.04em)}
.z-num.flash{color:var(--accent);transition:none}
/* status: empty square = open, tick = done, cross = cancelled */
.z-stat{
  margin-left:auto;flex-shrink:0;width:36px;height:36px;display:flex;align-items:center;justify-content:center;
  background:var(--ctl);color:var(--ink-68);
}
.z-stat .ico{width:20px;height:20px}
.z-stat:active{background:var(--ctl-2)}
.z-stat.done{background:var(--ink);color:var(--bar)}
.z-stat.cancelled{background:var(--bg);color:var(--ink-68)}
/* done = locked: only the box colour changes */
.zblock.locked{background:#1d1d1d}
/* a cancelled záběr sinks back into the page */
.zblock.cancelled{background:transparent;background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0 6px,transparent 6px 12px);padding-bottom:0}
.zblock.cancelled .z-num{color:var(--ink-30);text-decoration:line-through;text-decoration-thickness:2px}
.z-edit{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 12px;padding:12px 0}
.z-edit .field{width:76px}
.z-edit .actions{display:flex;gap:8px}
.z-edit .text-btn{margin-left:auto}

/* take */
.take.open{background:var(--ctl);margin:0 -12px;padding:0 12px 4px}
.take-row{display:flex;align-items:center;min-height:54px;gap:4px}
.star{width:40px;height:48px;margin-left:-10px;display:flex;align-items:center;justify-content:center;color:var(--ink-30);flex-shrink:0}
.star.on{color:var(--accent)}
.star.on svg{fill:currentColor}
.take-toggle{flex:1;min-width:0;height:54px;display:flex;align-items:center;gap:10px;text-align:left}
.take-num{font-size:var(--fs-body);font-weight:600;flex-shrink:0;white-space:nowrap}
.chev{margin-left:auto;color:var(--ink-30);width:16px;height:16px;transition:transform .25s var(--ease);flex-shrink:0}
.take.open .chev{transform:rotate(180deg);color:var(--ink)}
.chips{display:flex;gap:6px;flex-shrink:0}
.chip{
  position:relative;width:40px;height:40px;background:var(--ctl);color:var(--ink-68);
  font-size:var(--fs-label);font-weight:700;display:flex;align-items:center;justify-content:center;
}
.take.open .chip{background:var(--ctl-2)}
.chip:active{background:var(--ctl-2)}
.chip.on,.take.open .chip.on{background:var(--signed);color:var(--bar)}
/* this department left a note: thick bar along the bottom of its button */
.chip.note::after{content:'';position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--ink)}

.take-body{padding:4px 0 14px;display:flex;flex-direction:column;gap:14px}
.ro-text{font-size:var(--fs-body);padding:4px 0;overflow-wrap:anywhere}
.ro-text.none{color:var(--ink-30)}
.pill.ro{padding-right:10px}
.zblock.locked .take.open{background:transparent}
.field{display:flex;flex-direction:column;gap:4px}
.field-in{
  width:100%;background:var(--bg);border:0;border-radius:0;
  font-size:16px;padding:10px 12px;color:var(--ink);
}
.field-in::placeholder{color:var(--ink-30)}
.field-in:focus{outline:none;background:var(--bar)}
.props{display:flex;flex-direction:column;gap:10px;padding-top:4px}
.pills{display:flex;flex-wrap:wrap;gap:6px}

.text-btn{
  align-self:flex-start;min-height:40px;display:inline-flex;align-items:center;gap:8px;
  font-size:var(--fs-micro);letter-spacing:var(--track);text-transform:uppercase;color:var(--ink-68);
}
.text-btn span.u{text-decoration:underline;text-decoration-color:var(--ink-30);text-underline-offset:5px}
.text-btn:active{color:var(--ink)}
.prop-add{display:flex;gap:8px;align-items:flex-end}
.ac{position:relative;flex:1;min-width:0}
.ac-list{position:absolute;top:100%;left:0;right:0;z-index:20;background:var(--bar);max-height:176px;overflow-y:auto;display:none}
.ac-list.show{display:block}
.ac-item{display:block;width:100%;text-align:left;padding:0 12px;min-height:44px;font-size:14px}
.ac-item:active{background:var(--ctl)}
.note-sug{background:var(--ctl-2);z-index:30;box-shadow:0 10px 24px rgba(0,0,0,.45)}
.note-sug .ac-item:active{background:var(--signed);color:var(--bar)}
.note-sug .ac-item{color:var(--ink)}
.sq-btn{width:42px;height:42px;background:var(--ctl-2);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:15px}
.sq-btn.fill{background:var(--ink);color:var(--bar)}

/* ghost = the next take, faint until you tap something on it */
.take.ghost .star,.take.ghost .take-num{opacity:.38}
.take.ghost .chip{background:transparent;background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.06) 0 3px,transparent 3px 6px);color:var(--ink-30)}

/* ===== Plain list rows (projects, days, settings): filled boxes ===== */
.row-link{width:100%;display:flex;align-items:center;gap:16px;padding:16px 14px;margin-bottom:8px;background:var(--box);text-align:left}
.row-link:active{background:var(--ctl)}
.row-main{flex:1;min-width:0}
.row-name{font-size:var(--fs-label);letter-spacing:var(--track);text-transform:uppercase;overflow-wrap:anywhere}
.row-meta{font-size:var(--fs-micro);color:var(--ink-50);margin-top:4px}
.row-track{margin-top:12px;height:2px;background:var(--ctl)}
.row-track div{height:100%;background:var(--ink)}
.row-side{font-size:var(--fs-label);color:var(--ink-68);flex-shrink:0}
.row-arrow{color:var(--ink-30);flex-shrink:0}
/* project / day rows: the name opens it, the pencil on the right renames it */
.row-box{display:flex;align-items:stretch;margin-bottom:8px;background:var(--box)}
.row-open{flex:1;min-width:0;display:flex;align-items:center;gap:16px;padding:18px 4px 18px 14px;text-align:left}
.row-open:active,.row-edit:active{background:var(--ctl)}
.row-box .row-main{display:block}
.row-box .row-name{display:block}
.row-open > .row-name{flex:1;min-width:0}
.row-box .row-track{display:block}
.row-box .row-track span{display:block;height:100%;background:var(--ink)}
.menu-overlay{position:fixed;inset:0;z-index:210}
.menu{position:fixed;min-width:180px;background:var(--ctl-2);box-shadow:0 12px 32px rgba(0,0,0,.5);display:flex;flex-direction:column}
.menu-item{min-height:48px;padding:0 18px;text-align:left;font-size:var(--fs-label);letter-spacing:var(--track);text-transform:uppercase}
.menu-item:active{background:var(--signed);color:var(--bar)}
.row-edit{width:52px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--ink-68)}
.switch{width:46px;height:26px;background:var(--ctl-2);padding:3px;flex-shrink:0;display:flex}
.switch span{width:20px;height:20px;background:var(--ink-50);transition:transform .2s var(--ease)}
.switch.on{background:var(--signed)}
.switch.on span{background:var(--ink);transform:translateX(20px)}

.empty{padding:64px 0 24px}
.empty .display{font-size:36px;line-height:.95;color:var(--ink-30);margin-bottom:14px}
.empty p{font-size:var(--fs-label);color:var(--ink-50);max-width:32ch;line-height:1.7}

/* ===== Dock (bottom bar) ===== */
.dock{
  position:relative;z-index:30;flex-shrink:0;background:var(--bar);
  display:flex;gap:10px;padding:12px var(--gutter);
}
.btn{
  min-height:48px;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:10px;
  font-size:var(--fs-label);font-weight:600;letter-spacing:var(--track);text-transform:uppercase;border-radius:0;
}
.btn-primary{background:var(--ink);color:var(--bar)}
.btn-primary:active{background:var(--ink-68)}
.btn-line{background:var(--ctl);color:var(--ink)}
.btn-line:active{background:var(--ctl-2)}
.btn-grow{flex:1}
.btn-full{width:100%}
.btn-sq{width:48px;padding:0;flex-shrink:0}
.dock-wrap{flex-wrap:wrap}
.btn-wide{flex:1 0 100%}
.stack{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.btn-row{display:flex;gap:10px;margin-top:16px}
.btn-row .btn{flex:1}
/* the paste button sits inside the text box, bottom right */
.paste-wrap{position:relative}
.paste-wrap textarea.mono{min-height:230px;padding-bottom:68px}
.paste-btn{position:absolute;right:10px;bottom:14px;min-height:44px;padding:0 14px}

/* ===== Forms / text areas ===== */
.hint{font-size:var(--fs-label);color:var(--ink-68);line-height:1.7;padding:22px 0 16px}
textarea.mono{
  width:100%;min-height:200px;background:var(--box);border:0;border-radius:0;
  padding:12px;font-size:16px;line-height:1.5;resize:vertical;white-space:pre;overflow-wrap:normal;overflow-x:auto;
}
textarea.mono:focus{outline:none;background:var(--ctl)}
.table-wrap{overflow-x:auto;margin:14px 0}
.preview-table{border-collapse:collapse;font-size:var(--fs-micro)}
.preview-table th,.preview-table td{padding:6px 12px;text-align:left;white-space:nowrap}
.preview-table tr:nth-child(even) td{background:var(--box)}
.preview-table th{color:var(--ink-50);font-weight:400;letter-spacing:var(--track)}

/* ===== Dialog ===== */
.dialog-overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.6);display:flex;align-items:flex-start;padding-top:calc(var(--safe-t) + 44px)}
.dialog{width:100%;background:var(--box);padding:22px var(--gutter) 20px}
.dialog h3{font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:var(--fs-display);line-height:1;margin-bottom:14px}
.dialog p{font-size:var(--fs-label);color:var(--ink-68);line-height:1.7}
.dialog-actions{display:flex;gap:10px;margin-top:20px}
.dialog-actions .btn{flex:1}
.dialog .field-in{margin-top:2px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}

/* ===== Dictionary ===== */
.dict-entry{padding:12px 14px;margin-bottom:8px;background:var(--box)}
.dict-name{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}

/* ===== Toast ===== */
.toast{
  position:fixed;left:var(--gutter);right:var(--gutter);top:calc(var(--safe-t) + 52px);z-index:300;
  background:var(--ctl-2);padding:12px 14px;
  font-size:var(--fs-micro);letter-spacing:.08em;text-transform:uppercase;
  opacity:0;transform:translateY(-6px);transition:opacity .2s,transform .2s var(--ease);pointer-events:none;
}
.toast.show{opacity:1;transform:none}

/* ===== Keyboard bar: sits on top of the iPhone keyboard, like Obsidian's ===== */
.kbbar{
  position:fixed;left:0;right:0;bottom:0;z-index:250;height:44px;
  background:var(--bar);display:flex;align-items:center;justify-content:flex-end;padding:0 6px 0 var(--gutter);
  will-change:transform;
}
.kbbar[hidden]{display:none}
.kbbar .lbl{margin-right:auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kb-hide{height:44px;padding:0 12px;display:flex;align-items:center;gap:10px;font-size:var(--fs-micro);letter-spacing:var(--track);text-transform:uppercase;color:var(--ink)}
.kb-hide:active{color:var(--ink-50)}
body.kb-open .dock{display:none}

@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

<body>
<div id="app"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="kbbar" class="kbbar" hidden><span class="label lbl" id="kb-lbl"></span></div>

<script>
// ===================================================================
// DATA — same schema and storage key as before, so existing data carries over
// ===================================================================
const STORAGE_KEY = 'klapkolist_data';
let data = { projects: [], dictionary: {} };
let downloads = null;

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function newTake(n){ return { id: uid(), number: n, star: false, rezie: false, rezieNote: '', kamera: false, kameraNote: '', zvuk: false, zvukNote: '', properties: [] }; }

function normalize(){
  if (!Array.isArray(data.projects)) data.projects = [];
  if (!data.dictionary || typeof data.dictionary !== 'object') data.dictionary = {};
  if (!data.settings || typeof data.settings !== 'object') data.settings = {};
  if (data.settings.stars === undefined) data.settings.stars = true;
  data.projects.forEach(p => {
    if (!Array.isArray(p.nds)) p.nds = [];
    p.nds.forEach(nd => {
      if (!Array.isArray(nd.zabery)) nd.zabery = [];
      if (nd.obrazStatus && typeof nd.obrazStatus === 'object'){
        nd.zabery.forEach(z => { const st = nd.obrazStatus[z.obraz]; if (st && !z.status && st !== 'open') z.status = st; if (z.status === 'open') delete z.status; });
        delete nd.obrazStatus;
      }
      nd.zabery.forEach(z => {
        if (!Array.isArray(z.takes)) z.takes = [];
        z.takes.forEach(t => { if (!Array.isArray(t.properties)) t.properties = []; });
      });
    });
  });
  // Remembered notes, kept per department so režie never suggests kamera's notes.
  if (!data.noteHistory || typeof data.noteHistory !== 'object'){
    data.noteHistory = { rezie: [], kamera: [], zvuk: [] };
    data.projects.forEach(p => p.nds.forEach(nd => nd.zabery.forEach(z => z.takes.forEach(t =>
      ['rezie', 'kamera', 'zvuk'].forEach(d => { const v = (t[d + 'Note'] || '').trim(); if (v && !data.noteHistory[d].some(x => fold(x) === fold(v))) data.noteHistory[d].push(v); })))));
  }
  ['rezie', 'kamera', 'zvuk'].forEach(d => { if (!Array.isArray(data.noteHistory[d])) data.noteHistory[d] = []; });
}
// lower case, no diacritics: "Ostrost" matches "ostrost", "zaostreni" matches "zaostření"
function fold(x){ return String(x).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim(); }
function rememberNote(dept, text){
  const v = (text || '').trim();
  if (!v || !data.noteHistory) return;
  const list = data.noteHistory[dept];
  const i = list.findIndex(x => fold(x) === fold(v));
  if (i >= 0) list.splice(i, 1);
  list.unshift(v);                 // most recent first
  if (list.length > 80) list.length = 80;
  saveData();
}
function loadData(){
  try{ const raw = localStorage.getItem(STORAGE_KEY); if (raw) data = JSON.parse(raw); }
  catch(e){ console.error('Load failed', e); }
  normalize();
}
function saveData(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
  catch(e){ console.error('Save failed', e); showToast('Uložení selhalo — zkontrolujte místo v telefonu'); }
}

function showToast(msg, ms = 2200){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), ms);
}

function findProject(id){ return data.projects.find(p => p.id === id); }
function findND(proj, id){ return proj.nds.find(n => n.id === id); }
function isTakeDone(t){ return t.rezie && t.kamera && t.zvuk; }
function isZaberDone(z){ return z.takes.some(isTakeDone); }
function starsOn(){ return data.settings?.stars !== false; }
function hasStarredTake(z){ return starsOn() && z.takes.some(t => t.star); }
function obZabery(nd, ob){ return nd.zabery.filter(z => z.obraz === ob); }
// Each záběr is marked by hand: z.status = 'done' | 'cancelled'. Nothing is marked automatically.
function zCancelled(nd, z){ return z.status === 'cancelled'; }
function zDone(nd, z){ return !zCancelled(nd, z) && z.status === 'done'; }
function zState(nd, z){ return zCancelled(nd, z) ? 'cancelled' : zDone(nd, z) ? 'done' : 'open'; }
function ndStats(nd){
  const live = nd.zabery.filter(z => !zCancelled(nd, z));
  return { total: live.length, done: live.filter(z => zDone(nd, z)).length };
}
// A záběr marked done is locked: taps on it only explain how to unlock it.
function isLocked(z){ return z.status === 'done'; }
function lockedTap(){ showToast('Záběr je hotový — pro úpravy ho odemkněte klepnutím na ✓', 2600); }
function guard(z, fn){ return (...a) => isLocked(z) ? lockedTap() : fn(...a); }
function zLabel(z){ return `${z.obraz} | ${z.zaber}`; }
function takeWord(n){ return n === 1 ? 'take' : (n >= 2 && n <= 4 ? 'taky' : 'taků'); }
function dayWord(n){ return n === 1 ? 'natáčecí den' : (n >= 2 && n <= 4 ? 'natáčecí dny' : 'natáčecích dnů'); }

function addToDict(key, value){
  if (!key) return;
  const k = key.trim().toLowerCase();
  if (!data.dictionary[k]) data.dictionary[k] = [];
  if (value && value.trim() && !data.dictionary[k].includes(value.trim())) data.dictionary[k].push(value.trim());
  saveData();
}

function el(tag, attrs, ...children){
  const e = document.createElement(tag);
  if (attrs) Object.entries(attrs).forEach(([k, v]) => {
    if (v == null || v === false) return;
    if (k === 'className') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'value') e.value = v;
    else e.setAttribute(k, v === true ? '' : v);
  });
  children.flat().forEach(c => {
    if (c == null || c === false) return;
    e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return e;
}

const ICONS = {
  back: '<path d="M15 5l-7 7 7 7"/>',
  settings: '<path d="M4 7h9M18 7h2M4 17h3M12 17h8"/><rect x="13" y="5" width="5" height="4"/><rect x="7" y="15" width="5" height="4"/>',
  edit: '<path d="M4 20h4L19 9l-4-4L4 16z"/>',
  share: '<path d="M12 15V4M7 9l5-5 5 5M5 14v6h14v-6"/>',
  import: '<path d="M12 3v12M7 10l5 5 5-5M4 15v5h16v-5"/>',
  trash: '<path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/>',
  star: '<path d="M12 3.6l2.6 5.3 5.8.8-4.2 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z"/>',
  chev: '<path d="M6 9l6 6 6-6"/>',
  arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>',
  tick: '<path d="M5 12.5l4.5 4.5L19 7"/>',
  cross: '<path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>',
  dots: '<circle cx="5" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.6" fill="currentColor" stroke="none"/>',
  kbdown: '<rect x="3" y="4" width="18" height="11"/><path d="M7 8h1M11 8h2M16 8h1M8 11.5h8M9 18.5l3 2.5 3-2.5"/>'
};
function icon(name, cls = ''){
  const s = el('span', { className: 'ico ' + cls, 'aria-hidden': 'true' });
  s.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="square" stroke-linejoin="miter">${ICONS[name]}</svg>`;
  return s;
}
function iconBtn(name, label, onClick){ return el('button', { className: 'icon-btn', 'aria-label': label, title: label, onClick }, icon(name)); }

// ===== SAVING FILES =====
async function saveFile(filename, text, mime){
  if (downloads){
    try{ await downloads.save({ filename, data: text }); showToast('Soubor uložen'); return; }
    catch{ showToast('Uložení zrušeno'); return; }
  }
  try{
    const file = new File([text], filename, { type: mime });
    if (navigator.canShare && navigator.canShare({ files: [file] })){ await navigator.share({ files: [file] }); return; }
  }catch(e){ if (e && e.name === 'AbortError') return; }
  try{
    const a = el('a', { href: URL.createObjectURL(new Blob([text], { type: mime })), download: filename });
    document.body.appendChild(a); a.click(); a.remove();
    showToast('Soubor stažen'); return;
  }catch{}
  try{ await navigator.clipboard.writeText(text); showToast('Uložení nešlo — obsah je ve schránce'); }
  catch{ showToast('Soubor se nepodařilo uložit'); }
}
function safeName(x){ return String(x).trim().replace(/[\\/:*?"<>|]+/g, '').replace(/\s+/g, '_') || 'x'; }

// ===== NAVIGATION =====
let navStack = [];
let currentScreen = null;
function navigate(fn, ...args){ if (currentScreen) navStack.push(currentScreen); currentScreen = { fn, args }; fn(...args); }
function goBack(){ if (!navStack.length) return; currentScreen = navStack.pop(); currentScreen.fn(...currentScreen.args); }
function refresh(){ if (currentScreen) currentScreen.fn(...currentScreen.args); }
function renderApp(...nodes){ const app = document.getElementById('app'); blurIfInside(app); app.innerHTML = ''; nodes.filter(Boolean).forEach(n => app.appendChild(n)); syncKbBar(); }
function blurIfInside(node){ const a = document.activeElement; if (a && a !== document.body && node.contains(a)) a.blur(); }

function header(title, opts = {}){
  const row = el('div', { className: 'bar-row' + (opts.back ? '' : ' no-back') },
    opts.back ? iconBtn('back', 'Zpět', goBack) : null,
    el('h1', { className: 'bar-title display' }, title),
    opts.count != null ? el('span', { className: 'bar-count tnum', id: 'bar-count' }, opts.count) : null,
    el('span', { className: 'bar-spacer' }),
    ...(opts.actions || [])
  );
  return el('header', { className: 'bar' }, row);
}

// ===== ⋯ MENU =====
function openMenu(anchor, items){
  document.querySelector('.menu-overlay')?.remove();
  const overlay = el('div', { className: 'menu-overlay' });
  const menu = el('div', { className: 'menu', role: 'menu' });
  items.forEach(it => menu.appendChild(el('button', { className: 'menu-item', role: 'menuitem', onClick: () => { overlay.remove(); it.action(); } }, it.label)));
  overlay.appendChild(menu);
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
  document.body.appendChild(overlay);
  const r = anchor.getBoundingClientRect();
  menu.style.right = Math.max(8, window.innerWidth - r.right) + 'px';
  const h = menu.offsetHeight;
  menu.style.top = (r.bottom + 4 + h > window.innerHeight - 8 ? r.top - h - 4 : r.bottom + 4) + 'px';
  menu.querySelector('button')?.focus({ preventScroll: true });
}

// ===== DIALOGS =====
function removeOverlay(o){ if (!o) return; blurIfInside(o); o.remove(); syncKbBar(); }
function closeDialog(){ removeOverlay(document.querySelector('.dialog-overlay')); }
function showDialog(title, content, actions){
  closeDialog();
  const overlay = el('div', { className: 'dialog-overlay' });
  const dialog = el('div', { className: 'dialog', role: 'dialog', 'aria-modal': 'true', 'aria-label': title });
  dialog.appendChild(el('h3', null, title));
  if (typeof content === 'string') dialog.appendChild(el('p', null, content));
  else if (content) dialog.appendChild(content);
  const row = el('div', { className: 'dialog-actions' });
  actions.forEach(a => row.appendChild(el('button', {
    className: `btn ${a.cls || 'btn-line'}`,
    onClick: () => { if (a.action && a.action() === false) return; removeOverlay(overlay); }
  }, a.label)));
  dialog.appendChild(row);
  overlay.appendChild(dialog);
  overlay.addEventListener('click', e => { if (e.target === overlay) removeOverlay(overlay); });
  document.body.appendChild(overlay);
  const inp = dialog.querySelector('input');
  if (inp){ inp.focus({ preventScroll: true }); if (inp.value) inp.select(); }
  return overlay;
}
function promptDialog(title, placeholder, callback, defaultVal = ''){
  const inp = el('input', { type: 'text', className: 'field-in', placeholder, 'aria-label': placeholder, value: defaultVal, autocomplete: 'off' });
  showDialog(title, inp, [
    { label: 'Zrušit' },
    { label: 'OK', cls: 'btn-primary', action: () => callback(inp.value.trim()) }
  ]);
  inp.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); closeDialog(); callback(inp.value.trim()); } });
}

// ===================================================================
// SCREEN: Projects
// ===================================================================
function screenProjects(){
  const content = el('main', { className: 'scroll' + (data.projects.length ? '' : ' grain') });
  if (!data.projects.length){
    content.appendChild(el('div', { className: 'empty' },
      el('div', { className: 'display' }, 'Žádný projekt'),
      el('p', null, 'Založte projekt a v něm první natáčecí den.')));
  } else {
    content.appendChild(el('div', { className: 'label section-label' }, 'Projekty'));
    // newest first
    [...data.projects].reverse().forEach(p => {
      content.appendChild(el('div', { className: 'row-box' },
        el('button', { className: 'row-open', onClick: () => navigate(screenNDs, p.id) },
          el('span', { className: 'row-name' }, p.name),
          el('span', { className: 'row-side tnum' }, `${p.nds.length} ND`)),
        el('button', { className: 'row-edit', 'aria-label': `Možnosti: ${p.name}`, 'aria-haspopup': 'menu', onClick: e => openMenu(e.currentTarget, [
          { label: 'Přejmenovat', action: () => promptDialog('Přejmenovat projekt', 'Nový název', name => { if (!name) return; p.name = name; saveData(); refresh(); }, p.name) },

function screenImport(projectId, ndId){
  const proj = findProject(projectId);
  const nd = proj ? findND(proj, ndId) : null;
  if (!nd){ goBack(); return; }

  const content = el('main', { className: 'scroll' });
  content.appendChild(el('p', { className: 'hint' }, 'Zkopíruj a vlož Google Sheets tabulku s denními dispozicemi.'));
  const ta = el('textarea', { className: 'mono', id: 'import-ta', 'aria-label': 'Tabulka k importu', placeholder: 'OBRAZ\tZÁBĚR\n2\t2\n2\t3\n5\t8\n5\t9\n3\t4' });
  const preview = el('div');
  const updatePreview = () => { if (ta.value.trim()) showImportPreview(preview, parseImport(ta.value)); else preview.innerHTML = ''; };
  let pt = 0;
  ta.addEventListener('input', () => { clearTimeout(pt); pt = setTimeout(updatePreview, 250); });

  const pasteBtn = el('button', { className: 'btn btn-primary paste-btn', onClick: async () => {
    try{
      if (!navigator.clipboard || !navigator.clipboard.readText) throw new Error('no clipboard');
      const txt = await navigator.clipboard.readText();
      if (!txt || !txt.trim()){ showToast('Schránka je prázdná'); return; }
      ta.value = txt; updatePreview();
      const n = parseImport(txt).length;
      showToast(n ? `Vloženo · ${n} řádků` : 'Vloženo, ale bez řádků s čísly obrazu a záběru');
    }catch{
      // Some views (e.g. the claude.ai link) don't let a page read the clipboard.
      ta.focus();
      showToast('Telefon nedovolil vložit přímo — podržte prst v poli a zvolte Vložit', 4000);
    }
  }}, 'Vložit');
  content.appendChild(el('div', { className: 'paste-wrap' }, ta, pasteBtn));
  content.appendChild(preview);

  const goDay = () => { navStack.pop(); currentScreen = null; navigate(screenND, projectId, ndId); };
  content.appendChild(el('div', { className: 'btn-row' },
    el('button', { className: 'btn btn-line', onClick: goDay }, 'Přeskočit'),
    el('button', { className: 'btn btn-primary', onClick: () => {
      const parsed = parseImport(ta.value);
      if (!parsed.length){ showToast('Nenašel jsem žádné řádky s čísly obrazu a záběru'); return; }
      parsed.forEach(row => {
        let z = nd.zabery.find(x => x.obraz === row.obraz && x.zaber === row.zaber);
        if (!z){ z = { id: uid(), obraz: row.obraz, zaber: row.zaber, takes: [] }; nd.zabery.push(z); }
        if (row.stav) z.status = row.stav;
        if (!row.take) return;    // just OBRAZ + ZÁBĚR: the záběr starts empty, its first take waits in the faint row
        const t = newTake(row.take);
        t.rezie = !!row.rezie; t.rezieNote = row.rezieNote || '';
        t.kamera = !!row.kamera; t.kameraNote = row.kameraNote || '';
        t.zvuk = !!row.zvuk; t.zvukNote = row.zvukNote || '';
        z.takes.push(t);
      });
      saveData(); showToast(`Načteno ${parsed.length} řádků`);
      goDay();
    }}, 'Pokračovat')));

  renderApp(header('Import', { back: true, count: nd.name }), content);
}

function parseImport(text){
  if (!text.trim()) return [];
  const lines = text.trim().split(/\r?\n/);
  const results = [];
  const first = lines[0].toLowerCase();
  const start = (first.includes('obraz') || first.includes('záběr') || first.includes('zaber')) ? 1 : 0;
  for (let i = start; i < lines.length; i++){
    const cols = lines[i].split('\t');
    const obraz = parseInt(cols[0]), zaber = parseInt(cols[1]);
    if (isNaN(obraz) || isNaN(zaber)) continue;
    const row = { obraz, zaber };
    if (cols[2] !== undefined && cols[2].trim()) row.take = parseInt(cols[2]) || 1;
    else if (cols.length > 3) row.empty = true;   // exported záběr without takes
    if (cols[3] !== undefined) row.rezie = cols[3].trim().toUpperCase() === 'TRUE';
    if (cols[4] !== undefined) row.rezieNote = cols[4].trim();
    if (cols[5] !== undefined) row.kamera = cols[5].trim().toUpperCase() === 'TRUE';
    if (cols[6] !== undefined) row.kameraNote = cols[6].trim();
    if (cols[7] !== undefined) row.zvuk = cols[7].trim().toUpperCase() === 'TRUE';
    if (cols[8] !== undefined) row.zvukNote = cols[8].trim();
    if (cols[10] !== undefined){ const v = cols[10].trim().toUpperCase(); if (v === 'HOTOVO') row.stav = 'done'; if (v === 'ZRUŠENO') row.stav = 'cancelled'; }
    results.push(row);
  }
  return results;
}
function showImportPreview(container, parsed){
  container.innerHTML = '';
  if (!parsed.length){ container.appendChild(el('p', { className: 'hint' }, 'Žádné rozpoznané řádky. První dva sloupce musí být čísla obrazu a záběru.')); return; }
  const table = el('table', { className: 'preview-table tnum' });
  table.appendChild(el('tr', null, ...['OBRAZ', 'ZÁBĚR', 'TAKE'].map(h => el('th', null, h))));
  parsed.slice(0, 12).forEach(r => table.appendChild(el('tr', null, el('td', null, '' + r.obraz), el('td', null, '' + r.zaber), el('td', null, '' + (r.take || '–')))));
  container.appendChild(el('div', { className: 'table-wrap' },
    el('div', { className: 'label', style: 'margin-bottom:6px' }, `${parsed.length} řádků${parsed.length > 12 ? ' · zobrazeno 12' : ''}`),
    table));
}

// ===================================================================
// SCREEN: Shooting day — floating shot map + flat list of záběry
// ===================================================================
let openTakeId = null;
let editZId = null;         // záběr whose number is being edited inline
let propAddState = {};      // takeId -> { step: 'key'|'value', key }
const listScroll = {};      // ndId -> scrollTop
let ndCtx = null;           // { nd, projectId, ndId }

function screenND(projectId, ndId){

      const d = new Date().toISOString().slice(0, 10);

const OB_LABEL = { open: 'otevřeno', done: 'hotovo', cancelled: 'zrušeno' };

function fillMap(){
  const { nd } = ndCtx;
  const map = document.getElementById('map');
  if (!map) return;
  const keepScroll = document.getElementById('map-rows')?.scrollTop || 0;
  map.innerHTML = '';

  // Sorted by number, so a skipped obraz or záběr shows as a gap.
  const obs = [...new Set(nd.zabery.map(z => z.obraz))].sort((a, b) => a - b);
  const rows = el('div', { className: 'map-rows', id: 'map-rows' });
  obs.forEach(ob => {
    const zs = obZabery(nd, ob).sort((a, b) => a.zaber - b.zaber);
    rows.appendChild(el('div', { className: 'map-row' },
      el('span', { className: 'map-ob tnum' }, '' + ob),
      el('div', { className: 'map-cells' }, zs.map(z => el('button', {
        className: cellClass(z), id: 'cell-' + z.id,
        'aria-label': `Záběr ${zLabel(z)}${zCancelled(nd, z) ? ', zrušeno' : zDone(nd, z) ? ', hotovo' : ''}${hasStarredTake(z) ? ', má hvězdu' : ''}`,
        onClick: () => jumpTo(z)
      }, '' + z.zaber)))));
  });
  map.appendChild(rows);
  rows.scrollTop = keepScroll;
  markCurrent();
}
function cellClass(z){
  const nd = ndCtx.nd;
  if (zCancelled(nd, z)) return 'cell tnum cancel';
  return 'cell tnum' + (zDone(nd, z) ? ' done' : '') + (hasStarredTake(z) ? ' has-star' : '');
}

// OTEVŘENO → HOTOVO → ZRUŠENO → back to automatic
// OTEVŘENO → HOTOVO → ZRUŠENO → OTEVŘENO for one záběr
function cycleZaber(z){
  const nd = ndCtx.nd;
  const next = { open: 'done', done: 'cancelled', cancelled: 'open' }[zState(nd, z)];
  if (next === 'open') delete z.status; else z.status = next;
  if (next !== 'open' && z.takes.some(t => t.id === openTakeId)) openTakeId = null;   // close its open take
  if (next !== 'open' && editZId === z.id) editZId = null;
  saveData(); rerenderZ(z); updateStats();
}
function updateStats(){
  const { total, done } = ndStats(ndCtx.nd);
  const c = document.getElementById('bar-count'); if (c) c.textContent = `${done}/${total}`;
  fillMap();
}

function markCurrent(){
  const list = document.getElementById('list');
  const rows = document.getElementById('map-rows');
  if (!list || !rows) return;
  const top = list.scrollTop + 12;
  let cur = null;
  for (const b of list.querySelectorAll('.zblock')){
    if (b.offsetTop + b.offsetHeight > top){ cur = b; break; }
  }
  rows.querySelectorAll('.cell.cur').forEach(c => c.classList.remove('cur'));
  if (!cur) return;
  const cell = document.getElementById('cell-' + cur.dataset.zid);
  if (!cell) return;
  cell.classList.add('cur');
  const ct = cell.offsetTop, cb = ct + cell.offsetHeight;
  if (ct < rows.scrollTop) rows.scrollTop = ct - 4;
  else if (cb > rows.scrollTop + rows.clientHeight) rows.scrollTop = cb - rows.clientHeight + 4;
}

function jumpTo(z){
  const list = document.getElementById('list');
  const block = document.getElementById('z-' + z.id);
  if (!list || !block) return;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const target = Math.max(0, block.offsetTop - 4);
  list.scrollTo({ top: target, behavior: reduce ? 'auto' : 'smooth' });
  const num = block.querySelector('.z-num');
  num.classList.remove('flash'); void num.offsetWidth; num.classList.add('flash');
  clearTimeout(num._t); num._t = setTimeout(() => num.classList.remove('flash'), 1200);
}

// One tap: next number in the same obraz, no dialog. Tap the number to change it.
function addZaberQuick(nd){
  const last = nd.zabery[nd.zabery.length - 1];
  const obraz = last ? last.obraz : 1;
  let zaber = last ? last.zaber + 1 : 1;
  while (nd.zabery.some(x => x.obraz === obraz && x.zaber === zaber)) zaber++;
  const z = { id: uid(), obraz, zaber, takes: [] };
  nd.zabery.push(z); saveData();
  refresh();
  requestAnimationFrame(() => jumpTo(z));
  showToast(`Záběr ${obraz} | ${zaber} přidán — číslo změníte klepnutím na něj`);
}

// ----- záběr block -----
function renderZBlock(z){
  const nd = ndCtx.nd;
  const cancelled = zCancelled(nd, z);
  const done = zDone(nd, z);
  const n = z.takes.length;
  const block = el('section', { className: 'zblock' + (cancelled ? ' cancelled' : '') + (isLocked(z) ? ' locked' : ''), id: 'z-' + z.id, 'aria-label': `Záběr ${zLabel(z)}` });
  block.dataset.zid = z.id;

  if (editZId === z.id){
    block.appendChild(renderZEdit(z));
  } else {
    const st = zState(nd, z);
    block.appendChild(el('div', { className: 'z-head' },
      el('button', { className: 'z-num display tnum', 'aria-label': `Záběr ${zLabel(z)}, upravit číslo`, onClick: guard(z, () => { editZId = z.id; rerenderZ(z); }) },
        el('span', null, '' + z.obraz), el('span', { className: 'z-sep', 'aria-hidden': 'true' }, '|'), el('span', null, '' + z.zaber)),
      el('button', { className: 'z-stat ' + st, 'aria-label': `Záběr ${zLabel(z)}: ${OB_LABEL[st]}. Klepnutím změníte stav.`, title: OB_LABEL[st], onClick: () => cycleZaber(z) },
        st === 'done' ? icon('tick') : st === 'cancelled' ? icon('cross') : null)));
  }
  if (cancelled) return block;   // a cancelled obraz shows only its struck-through numbers

  z.takes.forEach(t => block.appendChild(renderTake(t, z)));
  if (!isLocked(z)) block.appendChild(renderGhost(z));   // done: no new takes
  return block;
}
function rerenderZ(z){
  const old = document.getElementById('z-' + z.id);
  if (old){ blurIfInside(old); old.replaceWith(renderZBlock(z)); }
  focusPending();
  syncKbBar();
}
// Elements rendered with data-autofocus get focus synchronously after they are in the page.
// It has to happen inside the tap itself, or iOS won't open the keyboard.
function focusPending(){
  const f = document.querySelector('[data-autofocus]');
  if (!f) return;
  f.removeAttribute('data-autofocus');
  f.focus({ preventScroll: true });
  if (f.dataset.select) f.select();
}
function zaberOfTake(takeId){
  return ndCtx.nd.zabery.find(z => z.takes.some(t => t.id === takeId)) || null;
}

// inline number edit — no popup
function renderZEdit(z){
  const nd = ndCtx.nd;
  const i1 = el('input', { type: 'number', inputmode: 'numeric', className: 'field-in tnum', id: 'e-ob-' + z.id, value: String(z.obraz) });
  const i2 = el('input', { type: 'number', inputmode: 'numeric', className: 'field-in tnum', id: 'e-z-' + z.id, value: String(z.zaber) });
  const close = () => { editZId = null; rerenderZ(z); };
  const save = () => {
    const obraz = parseInt(i1.value), zaber = parseInt(i2.value);
    if (isNaN(obraz) || isNaN(zaber)){ showToast('Vyplňte obraz i záběr číslem'); return; }
    if (nd.zabery.some(x => x !== z && x.obraz === obraz && x.zaber === zaber)){ showToast(`Záběr ${obraz} | ${zaber} už v tomto dni je`); return; }
    z.obraz = obraz; z.zaber = zaber; editZId = null;
    saveData(); rerenderZ(z); updateStats();
  };
  i1.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); i2.focus({ preventScroll: true }); i2.select(); } if (e.key === 'Escape') close(); });
  i2.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); save(); } if (e.key === 'Escape') close(); });
  i1.dataset.seq = '1'; i2.dataset.seq = '2';
  i2.setAttribute('data-autofocus', ''); i2.dataset.select = '1';
  i2.dataset.onlast = 'save'; i2._onLast = save;
  return el('div', { className: 'z-edit', 'data-fieldgroup': '' },
    el('div', { className: 'field' }, el('label', { className: 'label', for: i1.id }, 'Obraz'), i1),
    el('div', { className: 'field' }, el('label', { className: 'label', for: i2.id }, 'Záběr'), i2),
    el('div', { className: 'actions' },
      el('button', { className: 'sq-btn fill', 'aria-label': 'Uložit číslo', onClick: save }, '✓'),
      el('button', { className: 'sq-btn', 'aria-label': 'Zrušit úpravu', onClick: close }, '×')),
    el('button', { className: 'text-btn', onClick: () => {
      const doDelete = () => {
        nd.zabery = nd.zabery.filter(x => x.id !== z.id);
        editZId = null; saveData(); refresh(); showToast(`Záběr ${zLabel(z)} smazán`);
      };
      if (z.takes.length) showDialog('Smazat záběr?', `Záběr ${zLabel(z)} má ${z.takes.length} ${takeWord(z.takes.length)}. Smažou se i s poznámkami.`, [{ label: 'Zrušit' }, { label: 'Smazat', cls: 'btn-primary', action: doDelete }]);
      else doDelete();
    }}, icon('trash'), el('span', { className: 'u' }, 'Smazat záběr')));
}


function renderTake(t, z){
  const open = openTakeId === t.id;
  const wrap = el('div', { className: 'take' + (open ? ' open' : ''), id: 't-' + t.id });
  const row = el('div', { className: 'take-row' });

  if (starsOn()) row.appendChild(el('button', {
    className: 'star' + (t.star ? ' on' : ''), 'aria-pressed': t.star ? 'true' : 'false',
    'aria-label': t.star ? `Take ${t.number}: zrušit hvězdu` : `Take ${t.number}: označit jako nejlepší`,
    onClick: guard(z, () => {
      if (t.star) t.star = false; else { z.takes.forEach(x => x.star = false); t.star = true; }
      saveData(); rerenderZ(z); updateStats();
    })}, icon('star')));

  row.appendChild(el('button', {
    className: 'take-toggle', 'aria-expanded': open ? 'true' : 'false', 'aria-controls': 'tb-' + t.id,
    onClick: () => toggleTake(t, z)   // also on a locked záběr: notes can be read, not changed
  },
    el('span', { className: 'take-num tnum' }, `take ${t.number}`),
    icon('chev', 'chev')));

  const chips = el('div', { className: 'chips' });
  [['R', 'rezie', 'Režie'], ['K', 'kamera', 'Kamera'], ['Z', 'zvuk', 'Zvuk']].forEach(([l, k, full]) => {
    chips.appendChild(el('button', {
      className: 'chip' + (t[k] ? ' on' : '') + ((t[k + 'Note'] || '').trim() ? ' note' : ''), id: `chip-${t.id}-${k}`, 'aria-pressed': t[k] ? 'true' : 'false',
      'aria-label': `Take ${t.number}, ${full}: ${t[k] ? 'schváleno' : 'neschváleno'}${(t[k + 'Note'] || '').trim() ? ', má poznámku' : ''}`,
      onClick: guard(z, () => { t[k] = !t[k]; saveData(); rerenderZ(z); updateStats(); })
    }, l));
  });
  row.appendChild(chips);
  wrap.appendChild(row);

  if (open) wrap.appendChild(isLocked(z) ? renderTakeBodyReadOnly(t) : renderTakeBody(t, z, takeJustOpened === t.id));
  return wrap;
}

// The next take, always waiting at the bottom of a záběr. Tapping anything on it makes it real.
function renderGhost(z){
  const n = z.takes.length ? Math.max(...z.takes.map(t => t.number)) + 1 : 1;
  const make = (patch, openIt) => {
    const t = newTake(n);
    if (patch.star) z.takes.forEach(x => x.star = false);
    Object.assign(t, patch);
    z.takes.push(t);
    saveData();
    if (openIt){ rerenderZ(z); toggleTake(t, z, true); }
    else rerenderZ(z);
    updateStats();
  };
  const wrap = el('div', { className: 'take ghost' });
  const row = el('div', { className: 'take-row' });
  if (starsOn()) row.appendChild(el('button', { className: 'star', 'aria-label': `Přidat take ${n} jako nejlepší`, onClick: () => make({ star: true }) }, icon('star')));
  row.appendChild(el('button', { className: 'take-toggle', 'aria-label': `Přidat take ${n} a otevřít poznámky`, onClick: () => make({}, true) },
    el('span', { className: 'take-num tnum' }, `take ${n}`)));
  const chips = el('div', { className: 'chips' });
  [['R', 'rezie', 'Režie'], ['K', 'kamera', 'Kamera'], ['Z', 'zvuk', 'Zvuk']].forEach(([l, k, full]) => {
    chips.appendChild(el('button', { className: 'chip', 'aria-label': `Přidat take ${n} se schválením ${full}`, onClick: () => make({ [k]: true }) }, l));
  });
  row.appendChild(chips);
  wrap.appendChild(row);
  return wrap;
}

let takeJustOpened = null;
function toggleTake(t, z, forceOpen = false){
  const list = document.getElementById('list');
  const rowBefore = document.querySelector(`#t-${t.id} .take-row`);
  const before = rowBefore ? rowBefore.getBoundingClientRect().top : null;
  const prev = openTakeId;
  openTakeId = (openTakeId === t.id && !forceOpen) ? null : t.id;
  takeJustOpened = openTakeId;
  propAddState = {};

  // close the previous take first, without focusing anything
  if (prev && prev !== t.id){ const pz = zaberOfTake(prev); if (pz && pz !== z) rerenderZ(pz); }
  const old = document.getElementById('z-' + z.id);
  if (old){ blurIfInside(old); old.replaceWith(renderZBlock(z)); }
  takeJustOpened = null;

  const rowAfter = document.querySelector(`#t-${t.id} .take-row`);
  if (rowAfter){
    if (openTakeId === t.id && !isLocked(z)){
      // opening: bring the take to the top, so its fields are ready above the keyboard.
      // Instant, before the focus below, so the keyboard doesn't have to push the page.
      list.scrollTop += rowAfter.getBoundingClientRect().top - list.getBoundingClientRect().top - 6;
    } else if (before != null){
      // closing: keep the row exactly where it was
      list.scrollTop += rowAfter.getBoundingClientRect().top - before;
    }
  }
  focusPending();
  syncKbBar();
}
function reducedMotion(){ return matchMedia('(prefers-reduced-motion: reduce)').matches; }

function renderTakeBodyReadOnly(t){
  const body = el('div', { className: 'take-body ro', id: 'tb-' + t.id });
  [['R', 'rezieNote', 'Režie'], ['K', 'kameraNote', 'Kamera'], ['Z', 'zvukNote', 'Zvuk']].forEach(([l, k, full]) => {
    body.appendChild(el('div', { className: 'field' },
      el('span', { className: 'label' }, `${l} · ${full}`),
      el('p', { className: 'ro-text' + (t[k] ? '' : ' none') }, t[k] || '—')));
  });
  if (t.properties.length){
    body.appendChild(el('div', { className: 'props' }, el('div', { className: 'label' }, 'Vlastnosti'),
      el('div', { className: 'pills' }, t.properties.map(p => el('span', { className: 'pill ro' }, el('span', { className: 'pill-k' }, p.key), el('b', null, p.value))))));
  }
  return body;
}
function renderTakeBody(t, z, autofocus = false){
  const body = el('div', { className: 'take-body', id: 'tb-' + t.id, 'data-fieldgroup': '' });

  [['R', 'rezieNote', 'Režie'], ['K', 'kameraNote', 'Kamera'], ['Z', 'zvukNote', 'Zvuk']].forEach(([l, k, full]) => {
    const id = `n-${t.id}-${k}`;
    const dept = k.replace('Note', '');
    const inp = el('input', { id, type: 'text', className: 'field-in', placeholder: 'Poznámka', value: t[k] || '', autocomplete: 'off', autocorrect: 'off', enterkeyhint: k === 'zvukNote' ? 'done' : 'next', 'data-seq': '1', 'data-dept': dept });
    inp.addEventListener('change', () => rememberNote(dept, inp.value));
    if (autofocus && k === 'rezieNote') inp.setAttribute('data-autofocus', '');
    inp.addEventListener('input', () => {
      t[k] = inp.value; saveData();
      document.getElementById(`chip-${t.id}-${k.replace('Note', '')}`)?.classList.toggle('note', !!t[k].trim());
      showNoteSuggestions(inp);
    });

    inp.addEventListener('focus', () => showNoteSuggestions(inp));
    inp.addEventListener('blur', () => hideNoteSuggestions(inp));
    body.appendChild(el('div', { className: 'field' }, el('label', { className: 'label', for: id }, `${l} · ${full}`),
      el('div', { className: 'ac' }, inp, el('div', { className: 'ac-list note-sug' }))));
  });

  const props = el('div', { className: 'props' });
  props.appendChild(el('div', { className: 'label' }, 'Vlastnosti'));
  if (t.properties.length){
    props.appendChild(el('div', { className: 'pills' }, t.properties.map((p, i) => el('span', { className: 'pill' },
      el('span', { className: 'pill-k' }, p.key), el('b', null, p.value),
      el('button', { className: 'pill-x', 'aria-label': `Odebrat ${p.key}`, onClick: () => { t.properties.splice(i, 1); saveData(); rerenderZ(z); } }, '×')))));
  }
  const ps = propAddState[t.id];
  if (!ps){
    props.appendChild(el('button', { className: 'text-btn', onClick: () => { propAddState[t.id] = { step: 'key' }; rerenderZ(z); } }, el('span', { className: 'u' }, '+ Vlastnost')));
  } else if (ps.step === 'key'){
    props.appendChild(renderAutocompleteInput(Object.keys(data.dictionary), 'Název, např. objektiv',
      v => { propAddState[t.id] = { step: 'value', key: v }; rerenderZ(z); },
      () => { delete propAddState[t.id]; rerenderZ(z); }));
  } else {
    props.appendChild(renderAutocompleteInput(data.dictionary[ps.key.toLowerCase()] || [], `${ps.key}: hodnota`,
      v => { t.properties.push({ key: ps.key, value: v }); addToDict(ps.key, v); delete propAddState[t.id]; saveData(); rerenderZ(z); },
      () => { delete propAddState[t.id]; rerenderZ(z); }));
  }
  body.appendChild(props);

  const hasData = t.rezie || t.kamera || t.zvuk || t.rezieNote || t.kameraNote || t.zvukNote || t.properties.length;
  body.appendChild(el('button', { className: 'text-btn', onClick: () => {
    const doDelete = () => {
      z.takes = z.takes.filter(x => x.id !== t.id);
      openTakeId = null;
      saveData(); rerenderZ(z); updateStats();
    };
    if (hasData) showDialog('Smazat take?', `Take ${t.number} v záběru ${zLabel(z)} má vyplněné údaje.`, [{ label: 'Zrušit' }, { label: 'Smazat', cls: 'btn-primary', action: doDelete }]);
    else doDelete();
  }}, icon('trash'), el('span', { className: 'u' }, 'Smazat take')));

  return body;
}

function renderAutocompleteInput(suggestions, placeholder, onConfirm, onCancel){
  const wrap = el('div', { className: 'prop-add' });
  const ac = el('div', { className: 'ac' });
  const inp = el('input', { className: 'field-in', type: 'text', placeholder, 'aria-label': placeholder, autocomplete: 'off', enterkeyhint: 'done' });
  const list = el('div', { className: 'ac-list' });
  const confirm = () => { const v = inp.value.trim(); if (!v) return; list.classList.remove('show'); onConfirm(v); };

  function update(){
    const val = inp.value.toLowerCase();
    list.innerHTML = '';
    const filtered = suggestions.filter(s => s.toLowerCase().includes(val));
    if (!filtered.length || (filtered.length === 1 && filtered[0].toLowerCase() === val)){ list.classList.remove('show'); return; }
    filtered.slice(0, 8).forEach(s => list.appendChild(el('button', { className: 'ac-item', onClick: () => { inp.value = s; confirm(); } }, s)));
    list.classList.add('show');
  }
  inp.addEventListener('input', update);
  inp.addEventListener('focus', update);
  inp.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); confirm(); } if (e.key === 'Escape') onCancel(); });
  ac.appendChild(inp); ac.appendChild(list);
  wrap.appendChild(ac);
  wrap.appendChild(el('button', { className: 'sq-btn fill', 'aria-label': 'Potvrdit', onClick: confirm }, '✓'));
  wrap.appendChild(el('button', { className: 'sq-btn', 'aria-label': 'Zrušit', onClick: () => { list.classList.remove('show'); onCancel(); } }, '×'));
  inp.setAttribute('data-autofocus', '');
  return wrap;
}

function screenExport(projectId, ndId){
  const proj = findProject(projectId);
  const nd = proj ? findND(proj, ndId) : null;
  if (!nd){ goBack(); return; }

  const keys = new Set();
  nd.zabery.forEach(z => z.takes.forEach(t => t.properties.forEach(p => keys.add(p.key))));
  const propKeys = [...keys].sort();
  const stavOf = z => ({ done: 'HOTOVO', cancelled: 'ZRUŠENO' })[zState(nd, z)] || '';
  const rows = [['OBRAZ', 'ZÁBĚR', 'TAKE', 'STAR', 'REŽIE', 'pozn.', 'KAMERA', 'pozn.', 'ZVUK', 'pozn.', 'STAV', ...propKeys].join('\t')];
  const B = v => v ? 'TRUE' : 'FALSE';
  nd.zabery.forEach(z => {
    if (!z.takes.length){ rows.push([z.obraz, z.zaber, '', '', '', '', '', '', '', '', stavOf(z), ...propKeys.map(() => '')].join('\t')); return; }
    z.takes.forEach(t => rows.push([
      z.obraz, z.zaber, t.number, B(t.star),
      B(t.rezie), t.rezieNote || '', B(t.kamera), t.kameraNote || '', B(t.zvuk), t.zvukNote || '', stavOf(z),
      ...propKeys.map(k => (t.properties.find(p => p.key === k) || {}).value || '')
    ].join('\t')));
  });
  const tsv = rows.join('\n');

  const content = el('main', { className: 'scroll' });
  const takes = nd.zabery.reduce((a, z) => a + z.takes.length, 0);
  content.appendChild(el('p', { className: 'hint' }, `${nd.zabery.length} záběrů, ${takes} ${takeWord(takes)}. Zkopírujte a vložte do Sheets.`));
  const ta = el('textarea', { className: 'mono', id: 'export-ta', readonly: true, 'aria-label': 'Export ve formátu TSV' });
  ta.value = tsv;
  content.appendChild(ta);

  const stack = el('div', { className: 'stack' },
    el('button', { className: 'btn btn-primary btn-full', onClick: async () => {
      try{ await navigator.clipboard.writeText(tsv); showToast('Zkopírováno do schránky'); }
      catch{ ta.focus(); ta.select(); showToast('Text je označený — zkopírujte ho ručně'); }
    }}, 'Kopírovat'));
  stack.appendChild(el('button', { className: 'btn btn-line btn-full', onClick: () =>
    saveFile(`${safeName(proj.name)}_${safeName(nd.name)}.tsv`, tsv, 'text/tab-separated-values') }, 'Uložit .tsv'));
  content.appendChild(stack);
  renderApp(header('Export', { back: true, count: nd.name }), content);
}

async function boot(){

  navigate(screenProjects);

// ===================================================================
// KEYBOARD — keep the field you tap in the upper part of the screen, so the keyboard
// never has to push the page, and give the keyboard a bar with a "hide" button.
// ===================================================================
const isField = n => n && (n.matches('textarea') || (n.matches('input') && !['button', 'checkbox', 'radio'].includes(n.type)));
// Where the keyboard's top edge will be. Once it is open, visualViewport says exactly;
// before it opens, assume an iPhone keyboard with the suggestion row (about 42 % of the screen).
function keyboardTop(){
  const vv = window.visualViewport, H = window.innerHeight;
  if (vv && vv.height < H - 120) return vv.offsetTop + vv.height;
  return H * 0.58;
}
function keepFieldVisible(inp){
  const sc = inp.closest('.scroll');
  if (!sc) return;
  const label = inp.closest('.field')?.querySelector('label');
  const top = (label || inp).getBoundingClientRect().top;
  const n = inp.dataset.dept ? Math.min(noteHits(inp).length, 4) : 0;   // room for the suggestion dropdown
  const bottom = inp.getBoundingClientRect().bottom + n * 44;
  const scTop = sc.getBoundingClientRect().top + 6;
  const limit = keyboardTop() - 44 - 10;          // keyboard bar + a little air
  if (top >= scTop && bottom <= limit) return;     // already visible above the keyboard: don't move
  // otherwise move as little as possible: just enough to clear the keyboard, never above the top
  const delta = top < scTop ? top - scTop : Math.min(bottom - limit, top - scTop);
  sc.scrollTop += delta;                           // instant, before the keyboard slides in
}
// Enter / "Další": next field in the same group (take notes, záběr number)
function nextField(inp){
  const grp = inp.closest('[data-fieldgroup]');
  if (!grp) return null;
  const all = [...grp.querySelectorAll('input[data-seq]')];
  return all[all.indexOf(inp) + 1] || null;
}
function goNext(inp){
  const n = nextField(inp);
  if (n){ n.focus({ preventScroll: true }); if (n.type === 'number') n.select(); return; }
  if (inp._onLast) inp._onLast(); else inp.blur();
}
document.addEventListener('keydown', e => {
  const t = e.target;
  if (e.key !== 'Enter' || !isField(t) || !t.dataset.seq || t.matches('textarea')) return;
  if (t.dataset.onlast && !nextField(t)) return;   // its own handler saves
  if (t.id.startsWith('e-ob-')) return;            // handled by the záběr editor
  e.preventDefault();
  goNext(t);
});
function placeKbBar(){
  const bar = document.getElementById('kbbar');
  const vv = window.visualViewport;
  if (!bar || bar.hidden) return;
  // bottom of what is actually visible (above the keyboard), in layout coordinates
  const shift = vv ? (vv.offsetTop + vv.height - window.innerHeight) : 0;
  bar.style.transform = `translateY(${Math.min(0, shift)}px)`;
}
// e.g. "4 | 18 · Take 2 · Z · Zvuk", so you still know where you are once the row has scrolled away
function fieldLabel(inp){
  const own = inp.closest('.field')?.querySelector('label')?.textContent || inp.getAttribute('aria-label') || '';
  const z = inp.closest('.zblock')?.getAttribute('aria-label')?.replace('Záběr ', '');
  const t = inp.closest('.take')?.querySelector('.take-num')?.textContent;
  return [z, t, own].filter(Boolean).join(' · ');
}
let kbTimer = 0;
document.addEventListener('focusin', e => {
  if (!isField(e.target)) return;
  clearTimeout(kbTimer);
  keepFieldVisible(e.target);
  document.getElementById('kb-next').hidden = !nextField(e.target);
  const bar = document.getElementById('kbbar');
  document.getElementById('kb-lbl').textContent = fieldLabel(e.target);
  bar.hidden = false;
  document.body.classList.add('kb-open');
  placeKbBar();
  setTimeout(placeKbBar, 350);   // after the keyboard animation
});
// Earlier notes from the same department, most recent first, filtered by what you've typed.
// Shown in a dropdown right under the note field, the same way vlastnosti work.
function noteHits(inp){
  const dept = inp && inp.dataset ? inp.dataset.dept : null;
  const list = dept && data.noteHistory ? data.noteHistory[dept] : null;
  if (!list) return [];
  const q = fold(inp.value || '');
  return list.filter(x => fold(x) !== q && (!q || fold(x).includes(q))).slice(0, 8);
}
function showNoteSuggestions(inp){
  const box = inp.parentElement && inp.parentElement.querySelector('.note-sug');
  if (!box) return;
  const hits = noteHits(inp);
  box.innerHTML = '';
  hits.forEach(x => {
    const b = el('button', { className: 'ac-item', 'aria-label': `Doplnit: ${x}` }, x);
    // pointer/mouse down: preventDefault so the text field keeps focus and the keyboard stays up.
    // The fill happens on click, after the tap has finished, so the list closing can't let the
    // same tap land on the field underneath it.
    b.addEventListener('pointerdown', e => e.preventDefault());
    b.addEventListener('mousedown', e => e.preventDefault());
    b.addEventListener('click', e => {
      e.stopPropagation();
      inp.value = x;
      inp.dispatchEvent(new Event('input', { bubbles: true }));
      rememberNote(inp.dataset.dept, x);
      hideNoteSuggestions(inp);
      if (document.activeElement !== inp) inp.focus({ preventScroll: true });
    });
    box.appendChild(b);
  });
  box.classList.toggle('show', hits.length > 0);
}
function hideNoteSuggestions(inp){
  inp.parentElement?.querySelector('.note-sug')?.classList.remove('show');
}
// Hide the keyboard bar whenever no text field has focus (also called after every render).
function syncKbBar(){
  const bar = document.getElementById('kbbar');
  if (!bar || isField(document.activeElement)) return;
  bar.hidden = true;
  document.body.classList.remove('kb-open');
}
document.addEventListener('focusout', () => {
  clearTimeout(kbTimer);
  kbTimer = setTimeout(() => {
    if (isField(document.activeElement)) return;
    document.getElementById('kbbar').hidden = true;
    document.body.classList.remove('kb-open');
  }, 80);
});
if (window.visualViewport){
  visualViewport.addEventListener('resize', placeKbBar);
  visualViewport.addEventListener('scroll', placeKbBar);
}
(function(){
  const next = el('button', { className: 'kb-hide', id: 'kb-next', 'aria-label': 'Další pole' }, 'Další', icon('chev'));
  next.addEventListener('pointerdown', e => { e.preventDefault(); const a = document.activeElement; if (isField(a)) goNext(a); });
  document.getElementById('kbbar').appendChild(next);
  const btn = el('button', { className: 'kb-hide', 'aria-label': 'Skrýt klávesnici' }, 'Skrýt', icon('kbdown'));
  // pointerdown + preventDefault so the tap doesn't move focus somewhere else first
  btn.addEventListener('pointerdown', e => { e.preventDefault(); document.activeElement?.blur(); });
  btn.addEventListener('click', () => document.activeElement?.blur());
  document.getElementById('kbbar').appendChild(btn);
})();

document.addEventListener('click', e => {
  document.querySelectorAll('.ac-list.show').forEach(l => {
    if (l.parentElement.contains(e.target)) return;
    if (l.classList.contains('note-sug') && l.parentElement.contains(document.activeElement)) return;   // its field still has focus
    l.classList.remove('show');
  });
});
